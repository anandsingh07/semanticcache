services:
  postgres:
    # pgvector image ships the `vector` extension the migration needs.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: semcache
      POSTGRES_PASSWORD: semcache
      POSTGRES_DB: semcache
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semcache"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://semcache:semcache@postgres:5432/semcache
      REDIS_URL: redis://redis:6379
      PORT: 4000
      # Paste your key here or via an .env / secret. Misses fail clearly until it is set.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      SEMANTIC_THRESHOLD: ${SEMANTIC_THRESHOLD:-0.92}
      API_KEYS: ${API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"

volumes:
  pgdata:
